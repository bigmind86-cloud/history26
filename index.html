<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중2 역사 문제 풀기</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--fg:#1f2430;--sub:#6b7280;--pri:#4f46e5;--pri2:#6366f1;
--ok:#16a34a;--okbg:#ecfdf5;--no:#dc2626;--nobg:#fef2f2;--bd:#e5e7eb;--warn:#fffbeb;--warnbd:#fcd34d;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);color:var(--fg);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.app{background:var(--card);border-radius:18px;border:1px solid var(--bd);overflow:hidden;
box-shadow:0 6px 24px rgba(31,36,48,.06)}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:22px 20px}
header h1{margin:0;font-size:20px;font-weight:800}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.body{padding:20px}
/* 홈 */
.lead{font-size:14px;color:var(--sub);margin:0 0 14px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{border:1.5px solid var(--bd);border-radius:12px;padding:13px 12px;cursor:pointer;background:#fff;
text-align:left;font-size:14px;font-weight:700;transition:.15s;display:flex;flex-direction:column;gap:3px}
.unit:hover{border-color:var(--pri);transform:translateY(-1px)}
.unit small{font-weight:500;color:var(--sub);font-size:12px}
.unit.all{grid-column:1/3;background:linear-gradient(135deg,#eef2ff,#faf5ff);border-color:#c7d2fe}
.unit.all b{color:var(--pri)}
/* 진행바 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{border:none;background:#eef0f5;color:var(--fg);font-weight:700;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px}
.meta{font-size:13px;color:var(--sub);font-weight:600}
.score{margin-left:auto;font-size:13px;font-weight:700;color:var(--pri)}
.pbar{height:7px;background:#eceefc;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0;transition:.3s}
/* 문제 */
.utag{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);background:#eef2ff;padding:3px 9px;border-radius:99px;margin-bottom:10px}
.qtext{font-size:16.5px;font-weight:700;margin:0 0 14px}
.qtext small{font-weight:500;color:var(--sub);font-size:13.5px}
.qimg{width:100%;border-radius:12px;border:1px solid var(--bd);margin:0 0 14px;display:block}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:1.5px solid var(--bd);border-radius:11px;padding:12px 14px;cursor:pointer;font-size:14.5px;
background:#fff;text-align:left;display:flex;gap:10px;align-items:flex-start;transition:.12s;width:100%}
.opt:hover{border-color:var(--pri2)}
.opt .n{font-weight:800;color:var(--sub);flex-shrink:0}
.opt.sel{border-color:var(--pri);background:#eef2ff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .n{color:var(--ok)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt.no .n{color:var(--no)}
.opt:disabled{cursor:default}
/* OX */
.ox{display:flex;gap:12px}
.ox .opt{justify-content:center;font-size:22px;font-weight:800;padding:18px}
/* 단답 */
.short{display:flex;gap:8px}
.short input{flex:1;border:1.5px solid var(--bd);border-radius:11px;padding:13px 14px;font-size:15px;outline:none}
.short input:focus{border-color:var(--pri)}
/* 연결 */
.match .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.match .lft{font-weight:700;font-size:14.5px;min-width:110px}
.match .syms{display:flex;gap:6px;flex-wrap:wrap}
.sym{border:1.5px solid var(--bd);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px;background:#fff}
.sym.sel{border-color:var(--pri);background:#eef2ff;font-weight:700}
.sym.ok{border-color:var(--ok);background:var(--okbg)}
.sym.no{border-color:var(--no);background:var(--nobg)}
.legend{font-size:12.5px;color:var(--sub);background:#f8f9fc;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px}
/* 해설 */
.exp{margin-top:14px;border-radius:12px;padding:13px 15px;font-size:14px;display:none}
.exp.show{display:block}
.exp.c{background:var(--okbg);border:1px solid #bbf7d0}
.exp.w{background:var(--nobg);border:1px solid #fecaca}
.exp b{display:block;margin-bottom:4px}
.exp .ex{background:var(--warn);border:1px solid var(--warnbd);border-radius:9px;padding:9px 11px;margin-top:9px;color:#92400e}
/* 버튼 */
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:disabled{background:#c7cbe0;cursor:not-allowed}
.btn.gh{background:#eef0f5;color:var(--fg)}
.btn.sub{background:#fff;border:1.5px solid var(--bd);color:var(--fg)}
/* 결과 */
.result{text-align:center;padding:10px 0}
.rbig{font-size:52px;font-weight:900;color:var(--pri);margin:6px 0}
.rsub{color:var(--sub);font-size:14px;margin-bottom:18px}
.rstat{display:flex;gap:10px;margin-bottom:18px}
.rstat>div{flex:1;background:#f8f9fc;border:1px solid var(--bd);border-radius:12px;padding:14px}
.rstat .v{font-size:24px;font-weight:800}
.rstat .l{font-size:12px;color:var(--sub)}
.wronglist{text-align:left;margin-bottom:18px}
.wronglist h3{font-size:14px;margin:0 0 8px}
.wi{font-size:13px;background:#fff;border:1px solid var(--bd);border-left:3px solid var(--no);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.hidden{display:none}
.foot{text-align:center;font-size:11.5px;color:#aab;padding:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
<header>
  <h1>중2 역사 문제 풀기</h1>
  <p id="hsub">교과서 문제로 공부하고, 틀리면 해설을 확인하세요</p>
</header>
<div class="body" id="root"></div>
</div>

      }else if(chosen[idx]===val){c+=" sel";}
      var lbl = q.type==="ox"? o : '<span class="n">'+NUM[i]+'</span><span>'+o+'</span>';
      h+='<button class="'+c+'" '+(done?'disabled':'')+' onclick="pick('+(q.type==="ox"?"\'"+val+"\'":i)+')">'+lbl+'</button>';
    });
    h+='</div>';
  }
  else if(q.type==="multi"){
    h+='<div class="legend">정답을 <b>모두</b> 선택한 뒤 [채점하기]를 누르세요.</div><div class="opts">';
    var sel = chosen[idx]||[];
    q.opts.forEach(function(o,i){
      var c="opt";
      if(done){if(q.multi.indexOf(i)>=0)c+=" ok";else if(sel.indexOf(i)>=0)c+=" no";}
      else if(sel.indexOf(i)>=0)c+=" sel";
      h+='<button class="'+c+'" '+(done?'disabled':'')+' onclick="toggle('+i+')"><span class="n">'+(sel.indexOf(i)>=0?"✓":"")+'</span><span>'+o+'</span></button>';
    });
    h+='</div>';
  }
  else if(q.type==="short"){
    var vv = chosen[idx]||"";
    h+='<div class="short"><input id="ti" '+(done?'disabled':'')+' value="'+vv.replace(/"/g,'&quot;')+'" placeholder="정답을 입력하세요" onkeydown="if(event.key===\'Enter\')gradeShort()"></div>';
  }
  else if(q.type==="match"){
    var leg='<div class="legend">';
    for(var s in q.syms){leg+='<b>'+s+'</b> '+q.syms[s]+' &nbsp; ';}
    leg+='</div>';h+=leg;
    h+='<div class="match">';
    var sel = chosen[idx]||q.left.map(function(){return null;});
    q.left.forEach(function(lf,i){
      h+='<div class="row"><span class="lft">'+(i+1)+'. '+lf+'</span><span class="syms">';
      for(var s in q.syms){
        var c="sym";
        if(done){if(q.correct[i]===s)c+=" ok";else if(sel[i]===s)c+=" no";}
        else if(sel[i]===s)c+=" sel";
        h+='<button class="'+c+'" '+(done?'disabled':'')+' onclick="mpick('+i+',\''+s+'\')">'+s+'</button>';
      }
      h+='</span></div>';
    });
    h+='</div>';
  }

  // 해설
  if(done){
    var ok=isCorrect(q);
    h+='<div class="exp show '+(ok?'c':'w')+'"><b>'+(ok?'✅ 정답입니다!':'❌ 아쉽네요, 다시 확인해요')+'</b>';
    h+=ansText(q);
    h+='<div class="ex">💡 '+q.ex+'</div></div>';
  }

  // 버튼
  h+='<div class="actions">';
  if(idx>0)h+='<button class="btn sub" onclick="go(-1)">이전</button>';
  if(!done){
    if(q.type==="multi")h+='<button class="btn pri" onclick="gradeMulti()">채점하기</button>';
    else if(q.type==="short")h+='<button class="btn pri" onclick="gradeShort()">채점하기</button>';
    else if(q.type==="match")h+='<button class="btn pri" onclick="gradeMatch()">채점하기</button>';
    else h+='<button class="btn pri" id="nx" disabled onclick="next()">다음</button>';
  }else{
    h+='<button class="btn pri" onclick="next()">'+(idx===pool.length-1?'결과 보기':'다음 문제')+'</button>';
  }
  h+='</div>';
  el('root').innerHTML=h;
}

function ansText(q){
  if(q.type==="mc")return '<div>정답: <b>'+NUM[q.ans]+' '+q.opts[q.ans]+'</b></div>';
  if(q.type==="ox")return '<div>정답: <b>'+q.ans+'</b></div>';
  if(q.type==="short")return '<div>정답: <b>'+q.ans[0]+'</b></div>';
  if(q.type==="multi")return '<div>정답: <b>'+q.multi.map(function(i){return q.opts[i];}).join(", ")+'</b></div>';
  if(q.type==="match")return '<div>정답: <b>'+q.left.map(function(l,i){return l+"→"+q.correct[i];}).join(" / ")+'</b></div>';
  return '';
}
function isCorrect(q){
  var c=chosen[idx];
  if(q.type==="mc")return c===q.ans;
  if(q.type==="ox")return c===q.ans;
  if(q.type==="short")return q.ans.some(function(a){return norm(a)===norm(c);});
  if(q.type==="multi"){if(!c)return false;var a=q.multi.slice().sort().join(),b=c.slice().sort().join();return a===b;}
  if(q.type==="match"){if(!c)return false;return q.correct.every(function(s,i){return c[i]===s;});}
  return false;
}
function commit(){
  answered[idx]=true;doneCnt++;
  if(isCorrect(pool[idx]))correctCnt++;
  render();
}
function pick(v){if(answered[idx])return;chosen[idx]=v;commit();}
function toggle(i){if(answered[idx])return;var s=chosen[idx]?chosen[idx].slice():[];var p=s.indexOf(i);if(p>=0)s.splice(p,1);else s.push(i);chosen[idx]=s;render();}
function gradeMulti(){if(!chosen[idx]||!chosen[idx].length){alert("하나 이상 선택하세요.");return;}commit();}
function gradeShort(){var v=el('ti')?el('ti').value.trim():"";if(!v){alert("정답을 입력하세요.");return;}chosen[idx]=v;commit();}
function mpick(i,s){if(answered[idx])return;var a=chosen[idx]?chosen[idx].slice():pool[idx].left.map(function(){return null;});a[i]=s;chosen[idx]=a;render();}
function gradeMatch(){var a=chosen[idx];if(!a||a.some(function(x){return x===null;})){alert("모든 항목을 연결하세요.");return;}commit();}
function go(d){idx+=d;render();}
function next(){if(idx<pool.length-1){idx++;render();}else{result();}}

function result(){
  var pct=Math.round(correctCnt/pool.length*100);
  var msg = pct>=90?"훌륭해요! 완벽에 가까워요 🎉":pct>=70?"잘했어요! 조금만 더 👍":pct>=50?"절반 이상 맞혔어요, 복습해봐요":"틀린 문제를 다시 풀어봐요 💪";
  var h='<div class="result"><div class="rbig">'+pct+'<span style="font-size:24px">점</span></div>';
  h+='<div class="rsub">'+msg+'</div>';
  h+='<div class="rstat"><div><div class="v" style="color:var(--ok)">'+correctCnt+'</div><div class="l">맞은 문제</div></div>';
  h+='<div><div class="v" style="color:var(--no)">'+(pool.length-correctCnt)+'</div><div class="l">틀린 문제</div></div>';
  h+='<div><div class="v">'+pool.length+'</div><div class="l">전체 문제</div></div></div>';
  var wrong=[];pool.forEach(function(q,i){var ch=chosen[i];var ok;
    if(q.type==="mc")ok=ch===q.ans;else if(q.type==="ox")ok=ch===q.ans;
    else if(q.type==="short")ok=q.ans.some(function(a){return norm(a)===norm(ch);});
    else if(q.type==="multi")ok=ch&&q.multi.slice().sort().join()===ch.slice().sort().join();
    else if(q.type==="match")ok=ch&&q.correct.every(function(s,k){return ch[k]===s;});
    if(!ok)wrong.push(i);});
  if(wrong.length){
    h+='<div class="wronglist"><h3>틀린 문제 ('+wrong.length+')</h3>';
    wrong.forEach(function(i){var q=pool[i];var t=q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(t.length>46)t=t.slice(0,46)+'…';h+='<div class="wi">['+q.u+'] '+t+'</div>';});
    h+='</div>';
    h+='<div class="actions"><button class="btn sub" onclick="home()">목록으로</button><button class="btn pri" onclick="retryWrong(['+wrong.join(',')+'])">틀린 문제 다시 풀기</button></div>';
  }else{
    h+='<div class="actions"><button class="btn sub" onclick="home()">목록으로</button><button class="btn pri" onclick="start(null)">전체 다시 풀기</button></div>';
  }
  h+='</div>';
  el('root').innerHTML=h;
}
function retryWrong(ids){
  var np=ids.map(function(i){return pool[i];});
  pool=np;idx=0;correctCnt=0;doneCnt=0;
  answered=pool.map(function(){return false;});chosen=pool.map(function(){return null;});
  render();
}
home();
</script>
</body>
</html>
